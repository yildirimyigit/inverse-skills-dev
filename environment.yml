name: inverse-skills
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - scikit-learn
  - ipykernel
  - jupyterlab
  - pytorch=2.4.*
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1
  - tqdm
  - pyyaml
  - omegaconf
  - hydra-core
  - rich
  - tensorboard
  - wandb
  - h5py
  - imageio
  - imageio-ffmpeg
  - opencv
  - einops
  - pytest
  - ruff
  - black
  - pip:
      # Pinned <1.3 because stable-baselines3 2.8.0 requires gymnasium<1.3.0.
      # ManiSkill only needs >=0.29.1, so this is compatible with both.
      - gymnasium<1.3
      - mani-skill
      # Pinned to 2.8.0 deliberately: it declares torch>=2.3, which the
      # conda pytorch=2.4.* above satisfies. Newer SB3 (>=2.9) requires
      # torch>=2.8 and will silently upgrade pytorch, leaving torchvision /
      # torchaudio built against 2.4 and breaking ManiSkill's import.
      - stable-baselines3==2.8.0
      - tyro
      - trimesh
      - open3d
      - transforms3d
      - pyquaternion
